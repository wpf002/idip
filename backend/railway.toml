# Railway service config (service Root Directory = /backend).
# Railway builds the Dockerfile, injects $PORT (the Dockerfile binds to it),
# and provides DATABASE_URL from the Postgres plugin.
[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile"

[deploy]
healthcheckPath = "/health"
healthcheckTimeout = 120
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 3
